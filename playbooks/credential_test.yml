---
- name: Test Azure Credentials
  hosts: localhost
  connection: local
  tasks:
    - name: Verify Azure SDK availability
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - 'import azure.mgmt.resource; print("Azure SDK OK")'
      register: sdk_test
      changed_when: false

    - name: Show SDK test result
      ansible.builtin.debug:
        var: sdk_test.stdout

    - name: Check authentication by listing resource groups
      azure.azcollection.azure_rm_resourcegroup_info:
        name: "rg-buget"
