---
- name: Test
  hosts: localhost
  tasks:
    - name: Get Python interpreter path
      ansible.builtin.command: which python
      register: python_path
      changed_when: false

    - name: Debug Python path
      ansible.builtin.debug:
        var: python_path.stdout

    - name: Debug Python interpreter
      ansible.builtin.debug:
        msg: "Ansible Python interpreter: {{ ansible_playbook_python }}"

    - name: Debug Python interpreter
      ansible.builtin.command: which python
      register: python_path
      changed_when: false
    - name: Show Python path
      ansible.builtin.debug:
        var: python_path.stdout

    - name: Debug Azure library
      ansible.builtin.command:
        argv:
          - python
          - -c
          - "from azure.mgmt.resource import ResourceManagementClient; print('Azure works')"
      register: azure_test
      changed_when: false
    - name: Show Azure test
      ansible.builtin.debug:
        var: azure_test.stdout
