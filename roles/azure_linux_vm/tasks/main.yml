---
- name: Create virtual network
  azure.azcollection.azure_rm_virtualnetwork:
    resource_group: "{{ resource_group }}"
    name: "{{ azure_linux_vm_virtual_network_name }}"
    address_prefixes: "{{ azure_linux_vm_virtual_network_address_prefixes }}"
    location: "{{ location }}"
    tags:
      environment: "{{ env }}"
      responsible: "{{ responsible }}"

- name: Create subnet
  azure.azcollection.azure_rm_subnet:
    resource_group: "{{ resource_group }}"
    name: "{{ azure_linux_vm_subnet_name }}"
    address_prefix: "{{ azure_linux_vm_virtual_network_address_prefixes }}"
    virtual_network: "{{ azure_linux_vm_virtual_network_name }}"

- name: Create public IP
  azure.azcollection.azure_rm_publicipaddress:
    resource_group: "{{ resource_group }}"
    allocation_method: Static
    name: "{{ azure_linux_vm_public_ip_name }}"
    location: "{{ location }}"
    sku: Standard
    tags:
      environment: "{{ env }}"
      responsible: "{{ responsible }}"

- name: Create network interface
  azure.azcollection.azure_rm_networkinterface:
    resource_group: "{{ resource_group }}"
    name: "{{ networkinterface_name }}"
    location: "{{ location }}"
    subnet_name: "{{ azure_linux_vm_subnet_name }}"
    virtual_network_name: "{{ azure_linux_vm_virtual_network_name }}"
    tags:
      environment: "{{ env }}"
      responsible: "{{ responsible }}"
    ip_configurations:
      - name: "{{ azure_linux_vm_networkinterface_ip_configurations_name }}"
        public_ip_address_name: "{{ azure_linux_vm_public_ip_name }}"

- name: Create Linux VM
  azure.azcollection.azure_rm_virtualmachine:
    resource_group: "{{ resource_group }}"
    name: "{{ azure_linux_vm_name }}"
    location: "{{ location }}"
    vm_size: "{{ azure_linux_vm_size }}"
    admin_username: "{{ azure_linux_vm_admin_username }}"
    admin_password: "{{ azure_linux_vm_admin_password }}"
    network_interfaces: "{{ networkinterface_name }}"
    image:
      offer: "{{ azure_linux_vm_os_offer }}"
      publisher: "{{ azure_linux_vm_publisher }}"
      sku: "{{ azure_linux_vm_os_sku }}"
      version: "latest"
    managed_disk_type: "{{ azure_linux_vm_managed_disk_type }}"
    tags:
      environment: "{{ env }}"
      responsible: "{{ responsible }}"
