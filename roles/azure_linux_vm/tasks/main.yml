---
- name: Validate required virtual machine configuration
  ansible.builtin.assert:
    that:
      - resource_group is string and resource_group | trim | length > 0
      - location is string and location | trim | length > 0
      - env is string and env | trim | length > 0
      - responsible is string and responsible | trim | length > 0
      - azure_linux_vm_tags is mapping
      - >-
        azure_network_virtual_network_name is defined and
        azure_network_virtual_network_name is string and
        azure_network_virtual_network_name | trim | length > 0
      - >-
        azure_network_subnet_name is defined and
        azure_network_subnet_name is string and
        azure_network_subnet_name | trim | length > 0
      - >-
        azure_linux_vm_name is string and
        azure_linux_vm_name | trim | length > 0
      - >-
        azure_linux_vm_size is string and
        azure_linux_vm_size | trim | length > 0
      - >-
        azure_linux_vm_admin_username is string and
        azure_linux_vm_admin_username | trim | length > 0
      - >-
        azure_linux_vm_admin_password is string and
        azure_linux_vm_admin_password | length > 0
      - >-
        azure_linux_vm_os_offer is string and
        azure_linux_vm_os_offer | trim | length > 0
      - >-
        azure_linux_vm_os_sku is string and
        azure_linux_vm_os_sku | trim | length > 0
      - >-
        azure_linux_vm_publisher is string and
        azure_linux_vm_publisher | trim | length > 0
      - >-
        azure_linux_vm_managed_disk_type is string and
        azure_linux_vm_managed_disk_type | trim | length > 0
      - >-
        azure_linux_vm_public_ip_name is string and
        azure_linux_vm_public_ip_name | trim | length > 0
      - networkinterface_name is string and networkinterface_name | trim | length > 0
      - >-
        azure_linux_vm_networkinterface_ip_configurations_name is string and
        azure_linux_vm_networkinterface_ip_configurations_name | trim | length > 0
    fail_msg: >-
      All required resource group, location, tag, VM, and network configuration
      values must be non-empty strings.
  tags:
    - validate_vm_configuration
    - create_vm
    - add_tags_to_vm

- name: Create virtual machine infrastructure
  ansible.builtin.import_tasks: create_vm.yml
  tags:
    - create_vm

- name: Add tags to virtual machine infrastructure
  ansible.builtin.import_tasks: add_tags_to_vm.yml
  tags:
    - add_tags_to_vm
