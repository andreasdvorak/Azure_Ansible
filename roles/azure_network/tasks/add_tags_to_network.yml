---
- name: Add tags to virtual network
  azure.azcollection.azure_rm_virtualnetwork:
    resource_group: "{{ resource_group }}"
    name: "{{ azure_network_virtual_network_name }}"
    address_prefixes: "{{ azure_network_virtual_network_address_prefixes }}"
    location: "{{ location }}"
    tags: "{{ azure_network_tags | combine({'environment': env, 'responsible': responsible}) }}"
