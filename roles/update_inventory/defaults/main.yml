---
# resource_group and networkinterface_name are shared input variables: they keep
# the names used by the inventory and the linux_vm role.
resource_group: ""  # noqa: var-naming[no-role-prefix]
networkinterface_name: ""  # noqa: var-naming[no-role-prefix]

# Role-specific variables carry the role-name prefix.
update_inventory_target_host: "{{ inventory_hostname }}"
update_inventory_host_vars_dir: "{{ inventory_dir }}/host_vars"
update_inventory_host_vars_file: >-
  {{ update_inventory_host_vars_dir }}/{{ update_inventory_target_host }}.yml
