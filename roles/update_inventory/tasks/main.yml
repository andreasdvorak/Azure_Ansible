---
- name: Get the network interface of the VM
  azure.azcollection.azure_rm_networkinterface_info:
    resource_group: "{{ resource_group }}"
    name: "{{ networkinterface_name }}"
  register: update_inventory_networkinterface_info

- name: Extract the IP configuration of the network interface
  ansible.builtin.set_fact:
    update_inventory_ip_configuration: >-
      {{ update_inventory_networkinterface_info.networkinterfaces[0].ip_configurations[0] }}

- name: Extract the private IP address
  ansible.builtin.set_fact:
    update_inventory_private_ip: "{{ update_inventory_ip_configuration.private_ip_address }}"

- name: Show the private IP for verification
  ansible.builtin.debug:
    msg: "Private IP of {{ update_inventory_target_host }} is {{ update_inventory_private_ip }}"

- name: Ensure the host_vars directory exists
  ansible.builtin.file:
    path: "{{ update_inventory_host_vars_dir }}"
    state: directory
    mode: "0755"

- name: Write the private IP as ansible_host into the host_vars file
  ansible.builtin.lineinfile:
    path: "{{ update_inventory_host_vars_file }}"
    regexp: '^ansible_host:'
    line: "ansible_host: {{ update_inventory_private_ip }}"
    create: true
    mode: "0644"
