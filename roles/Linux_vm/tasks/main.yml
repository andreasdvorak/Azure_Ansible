---
- name: Create resource group
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}"
    location: "{{ location }}"
    tags:
      environment: "{{ env }}"
      responsible: "{{ responsible }}"

- name: Create virtual network
  azure.azcollection.azure_rm_virtualnetwork:
    resource_group: "{{ resource_group }}"
    name: "{{ virtual_network_name }}"
    address_prefixes: "{{ virtual_network_address_prefixes }}"
    location: "{{ location }}"

- name: Create subnet
  azure.azcollection.azure_rm_subnet:
    resource_group: "{{ resource_group }}"
    name: "{{ subnet_name }}"
    address_prefix: "{{ virtual_network_address_prefixes }}"
    virtual_network: "{{ virtual_network_name }}"

- name: Create public IP
  azure.azcollection.azure_rm_publicipaddress:
    resource_group: "{{ resource_group }}"
    allocation_method: Static
    name: "{{ public_ip_name }}"
    location: "{{ location }}"
    sku: Standard

- name: Create network interface
  azure.azcollection.azure_rm_networkinterface:
    resource_group: "{{ resource_group }}"
    name: "{{ networkinterface_name }}"
    location: "{{ location }}"
    subnet_name: "{{ subnet_name }}"
    virtual_network_name: "{{ virtual_network_name }}"
    ip_configurations:
      - name: "{{ networkinterface_ip_configurations_name }}"
        public_ip_address_name: "{{ public_ip_name }}"

- name: Create Linux VM
  azure.azcollection.azure_rm_virtualmachine:
    resource_group: "{{ resource_group }}"
    name: "{{ vm_name }}"
    location: "{{ location }}"
    vm_size: "{{ vm_size }}"
    admin_username: "{{ admin_username }}"
    admin_password: "{{ admin_password }}"
    network_interfaces: "{{ networkinterface_name }}"
    image:
      offer: "{{ os_offer }}"
      publisher: "{{ publisher }}"
      sku: "{{ os_sku }}"
      version: "latest"
    managed_disk_type: "{{ managed_disk_type }}"
