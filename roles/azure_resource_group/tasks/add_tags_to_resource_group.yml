---
- name: Add tags to resource group
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ item.name }}"
    location: "{{ location }}"
    state: present
    tags: >-
      {{
        item.tags | default({}) | combine(azure_resource_group_tags) |
        combine({'environment': item.env, 'responsible': item.responsible})
      }}
  loop: "{{ resource_groups }}"
  loop_control:
    label: "{{ item.name }}"
